<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LinkedFlow — AI Writing for LinkedIn Creators</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #06060e;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --indigo: #6366f1;
    --indigo-light: #a5b4fc;
    --violet: #8b5cf6;
    --emerald: #10b981;
    --text: #f0f0f8;
    --muted: rgba(255,255,255,0.4);
    --card-bg: rgba(15,15,30,0.8);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 70% -10%, rgba(99,102,241,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at -10% 80%, rgba(16,185,129,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 110%, rgba(139,92,246,0.08) 0%, transparent 60%);
  }

  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  /* Layout */
  .wrapper { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0; border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 11px; text-decoration: none; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    display: grid; place-items: center;
    font-family: 'Playfair Display', serif; font-weight: 900;
    font-size: 17px; color: #fff;
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  }
  .logo-text { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; color: var(--text); }
  .header-badge {
    font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--indigo-light); border: 1px solid rgba(99,102,241,0.25);
    border-radius: 20px; padding: 5px 14px;
  }

  /* Hero */
  .hero { text-align: center; padding: 64px 0 48px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--emerald); margin-bottom: 24px;
    border: 1px solid rgba(16,185,129,0.2); border-radius: 20px; padding: 5px 14px;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(34px, 6vw, 62px);
    font-weight: 900; line-height: 1.1;
    letter-spacing: -1.5px; margin-bottom: 18px;
  }
  .hero-title span {
    background: linear-gradient(100deg, var(--indigo-light), var(--violet));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-sub { color: var(--muted); font-size: 17px; font-weight: 300; line-height: 1.6; max-width: 520px; margin: 0 auto; }

  /* Tool tabs */
  .tool-bar {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 40px 0 28px;
  }
  .tool-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 22px; border-radius: 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted); cursor: pointer;
    font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500;
    transition: all 0.2s; white-space: nowrap;
  }
  .tool-btn:hover { border-color: rgba(99,102,241,0.3); color: var(--indigo-light); }
  .tool-btn.active {
    background: rgba(99,102,241,0.15);
    border-color: rgba(99,102,241,0.45);
    color: var(--indigo-light);
    box-shadow: 0 0 20px rgba(99,102,241,0.1);
  }

  /* Main card */
  .card {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 22px; overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.4);
    margin-bottom: 60px;
  }
  .card-left {
    padding: 36px; display: flex; flex-direction: column; gap: 20px;
    border-right: 1px solid var(--border);
  }
  .card-right { padding: 36px; display: flex; flex-direction: column; gap: 14px; }

  .card-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }

  /* Form */
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 500;
  }
  .field input, .field textarea, .field select {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 11px; padding: 13px 15px;
    color: var(--text); font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none; width: 100%; resize: vertical;
    transition: border-color 0.2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: rgba(99,102,241,0.4);
  }
  .field select { cursor: pointer; appearance: none; }

  .error-msg { color: #f87171; font-size: 13px; }

  .gen-btn {
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    color: #fff; border: none; border-radius: 13px;
    padding: 15px 28px; font-size: 15px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    box-shadow: 0 8px 30px rgba(99,102,241,0.35);
    transition: opacity 0.2s, transform 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .gen-btn:hover { transform: translateY(-1px); }
  .gen-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Output */
  .output-header { display: flex; justify-content: space-between; align-items: center; }
  .output-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .copy-btn {
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.25);
    color: var(--indigo-light); border-radius: 8px;
    padding: 6px 15px; font-size: 12px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.2s;
  }
  .copy-btn:hover { background: rgba(99,102,241,0.22); }

  .output-box {
    flex: 1; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 15px; padding: 22px;
    min-height: 300px; display: flex; flex-direction: column;
    font-family: 'DM Sans', sans-serif;
  }
  .output-text {
    font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.85);
    white-space: pre-wrap; word-break: break-word; flex: 1;
  }
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    opacity: 0.25; text-align: center;
  }
  .empty-icon { font-size: 36px; }
  .empty-text { font-size: 14px; color: var(--muted); }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    animation: spin 0.75s linear infinite; display: inline-block;
  }

  /* Shimmer */
  @keyframes shimmer { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }
  .shimmer { border-radius: 6px; background: rgba(255,255,255,0.07); animation: shimmer 1.4s ease infinite; }
  .sh1 { height: 14px; width: 88%; margin-bottom: 10px; }
  .sh2 { height: 14px; width: 72%; margin-bottom: 10px; }
  .sh3 { height: 14px; width: 82%; }

  /* Footer */
  footer { text-align: center; padding: 32px 0; color: rgba(255,255,255,0.18); font-size: 13px; border-top: 1px solid var(--border); }
  footer span { color: rgba(99,102,241,0.5); }

  /* Responsive */
  @media (max-width: 720px) {
    .card { grid-template-columns: 1fr; }
    .card-left { border-right: none; border-bottom: 1px solid var(--border); }
    .hero-title { font-size: 34px; }
    .tool-btn { font-size: 13px; padding: 9px 16px; }
  }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="grain"></div>

<div class="wrapper">
  <header>
    <a class="logo" href="#">
      <div class="logo-mark">L</div>
      <div class="logo-text">LinkedFlow</div>
    </a>
    <div class="header-badge">AI-Powered</div>
  </header>

  <section class="hero">
    <div class="hero-eyebrow">✦ For LinkedIn Creators</div>
    <h1 class="hero-title">Write content that<br/><span>actually gets noticed.</span></h1>
    <p class="hero-sub">Posts · Bios · Outreach · Hooks — generated in seconds with Claude AI.</p>
  </section>

  <div class="tool-bar" id="toolBar"></div>

  <div class="card">
    <div class="card-left">
      <div class="card-title" id="cardTitle"></div>
      <div id="formFields"></div>
      <div class="error-msg" id="errorMsg"></div>
      <button class="gen-btn" id="genBtn" onclick="generate()">✨ Generate</button>
    </div>
    <div class="card-right">
      <div class="output-header">
        <div class="output-label">Output</div>
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()" style="display:none">Copy</button>
      </div>
      <div class="output-box" id="outputBox">
        <div class="empty-state">
          <div class="empty-icon">✦</div>
          <div class="empty-text">Your generated content will appear here.</div>
        </div>
      </div>
    </div>
  </div>

  <footer>LinkedFlow · Built in India 🇮🇳 · Powered by <span>Claude AI</span></footer>
</div>

<script>
const TOOLS = [
  {
    id: "post", label: "LinkedIn Post", icon: "✍️",
    fields: [
      { id: "topic", label: "What's your post about?", placeholder: "e.g. I just landed my first 6-figure client as a freelancer", type: "textarea" },
      { id: "tone", label: "Tone", type: "select", options: ["Inspirational","Educational","Storytelling","Controversial","Humble brag"] },
      { id: "length", label: "Length", type: "select", options: ["Short (3-5 lines)","Medium (1 paragraph)","Long (hook + body)"] },
    ],
    prompt: f => `Write a LinkedIn post about: "${f.topic}". Tone: ${f.tone}. Length: ${f.length}. Rules: Start with a scroll-stopping first line (no "I" as first word). Use line breaks for readability. End with a subtle CTA or question. No hashtags. Make it feel human, not AI-generated.`
  },
  {
    id: "bio", label: "LinkedIn Bio", icon: "👤",
    fields: [
      { id: "role", label: "What do you do?", placeholder: "e.g. I help SaaS founders grow to $1M ARR through content", type: "input" },
      { id: "audience", label: "Who is your audience?", placeholder: "e.g. B2B founders, freelancers, recruiters", type: "input" },
      { id: "cta", label: "What action do you want them to take?", placeholder: "e.g. DM me, visit my website, follow me", type: "input" },
    ],
    prompt: f => `Write a compelling LinkedIn bio for someone who does: "${f.role}". Audience: "${f.audience}". CTA: "${f.cta}". Rules: First person. Bold positioning statement opening. Under 220 words. Clear CTA at end. No buzzwords like "passionate" or "guru".`
  },
  {
    id: "outreach", label: "Outreach Message", icon: "📩",
    fields: [
      { id: "recipient", label: "Who are you messaging?", placeholder: "e.g. A startup founder who just raised a Series A", type: "input" },
      { id: "goal", label: "What's your goal?", placeholder: "e.g. Get a discovery call, offer my services", type: "input" },
      { id: "context", label: "Any common ground or hook?", placeholder: "e.g. We're both in SaaS, loved their recent post", type: "input" },
    ],
    prompt: f => `Write a LinkedIn outreach message to: "${f.recipient}". Goal: "${f.goal}". Hook: "${f.context}". Rules: Under 80 words. Open with genuine observation — not flattery. Make it about THEM first. Be direct. Sound human. No "I hope this message finds you well".`
  },
  {
    id: "hook", label: "Hook Generator", icon: "🎣",
    fields: [
      { id: "topic", label: "What is your post about?", placeholder: "e.g. Why I quit my ₹20L job to freelance", type: "textarea" },
      { id: "count", label: "How many hooks?", type: "select", options: ["3 hooks","5 hooks","7 hooks"] },
    ],
    prompt: f => `Generate ${f.count} LinkedIn post opening hooks for: "${f.topic}". Rules: Each hook 1-2 lines max. Create curiosity or emotional tension. Vary styles: questions, bold statements, contrarian takes, storytelling openers. Do NOT start any hook with "I". Number each hook. Make them feel fresh and human.`
  }
];

let activeTool = TOOLS[0];
let fieldValues = {};
let outputText = "";

function renderToolBar() {
  const bar = document.getElementById("toolBar");
  bar.innerHTML = TOOLS.map(t => `
    <button class="tool-btn ${t.id === activeTool.id ? 'active' : ''}" onclick="selectTool('${t.id}')">
      ${t.icon} ${t.label}
    </button>
  `).join("");
}

function renderForm() {
  document.getElementById("cardTitle").textContent = `${activeTool.icon} ${activeTool.label}`;
  const container = document.getElementById("formFields");
  container.innerHTML = activeTool.fields.map(f => {
    if (f.type === "select") {
      return `<div class="field">
        <label>${f.label}</label>
        <select id="field_${f.id}" onchange="fieldValues['${f.id}']=this.value">
          ${f.options.map(o => `<option>${o}</option>`).join("")}
        </select>
      </div>`;
    } else if (f.type === "textarea") {
      return `<div class="field">
        <label>${f.label}</label>
        <textarea id="field_${f.id}" placeholder="${f.placeholder}" rows="3" oninput="fieldValues['${f.id}']=this.value"></textarea>
      </div>`;
    } else {
      return `<div class="field">
        <label>${f.label}</label>
        <input id="field_${f.id}" type="text" placeholder="${f.placeholder}" oninput="fieldValues['${f.id}']=this.value"/>
      </div>`;
    }
  }).join("");
  // init select defaults
  activeTool.fields.filter(f => f.type === "select").forEach(f => {
    fieldValues[f.id] = f.options[0];
  });
}

function selectTool(id) {
  activeTool = TOOLS.find(t => t.id === id);
  fieldValues = {};
  outputText = "";
  document.getElementById("errorMsg").textContent = "";
  document.getElementById("copyBtn").style.display = "none";
  resetOutput();
  renderToolBar();
  renderForm();
}

function resetOutput() {
  document.getElementById("outputBox").innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">✦</div>
      <div class="empty-text">Your generated content will appear here.</div>
    </div>`;
}

function showLoading() {
  document.getElementById("outputBox").innerHTML = `
    <div class="shimmer sh1"></div>
    <div class="shimmer sh2"></div>
    <div class="shimmer sh3"></div>`;
}

async function generate() {
  const missing = activeTool.fields.find(f => f.type !== "select" && (!fieldValues[f.id] || !fieldValues[f.id].trim()));
  if (missing) {
    document.getElementById("errorMsg").textContent = `Please fill in: ${missing.label}`;
    return;
  }
  document.getElementById("errorMsg").textContent = "";
  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Generating...`;
  document.getElementById("copyBtn").style.display = "none";
  showLoading();

  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + String.fromCharCode(115,107,45,111,114,45,118,49,45,56,48,54,54,48,99,98,102,98,52,56,53,97,54,100,56,56,50,52,54,48,49,100,50,52,97,55,102,53,52,97,50,57,48,99,53,53,98,56,99,55,48,53,54,102,50,54,52,100,100,48,51,102,53,98,56,99,54,54,53,102,51,54,99), "HTTP-Referer": "https://linked-flow-tavy.vercel.app", "X-Title": "LinkedFlow" },
      body: JSON.stringify({
        model: "nvidia/nemotron-3-super-120b-a12b:free",
        max_tokens: 1000,
        messages: [{ role: "user", content: activeTool.prompt(fieldValues) }]
      })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) {
      document.getElementById("outputBox").innerHTML = `<pre class="output-text" style="color:#f87171">Parse error: ${text.slice(0,300)}</pre>`;
      return;
    }
    if (data.error) {
      document.getElementById("outputBox").innerHTML = `<pre class="output-text" style="color:#f87171">API Error: ${data.error.message || JSON.stringify(data.error)}</pre>`;
      return;
    }
    outputText = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ? data.choices[0].message.content : "";
    if (!outputText) {
      document.getElementById("outputBox").innerHTML = `<pre class="output-text" style="color:#f87171">Empty response. Raw: ${text.slice(0,300)}</pre>`;
      return;
    }
    document.getElementById("outputBox").innerHTML = `<pre class="output-text">${escapeHtml(outputText)}</pre>`;
    document.getElementById("copyBtn").style.display = "block";
  } catch (e) {
    document.getElementById("outputBox").innerHTML = `<pre class="output-text" style="color:#f87171">Catch error: ${e.message}</pre>`;
  }

  btn.disabled = false;
  btn.innerHTML = "✨ Generate";
}

function copyOutput() {
  navigator.clipboard.writeText(outputText);
  const btn = document.getElementById("copyBtn");
  btn.textContent = "✓ Copied!";
  setTimeout(() => btn.textContent = "Copy", 2000);
}

function escapeHtml(text) {
  return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Init
renderToolBar();
renderForm();
</script>
</body>
</html>
